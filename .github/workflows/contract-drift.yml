name: Contract drift check
on:
  schedule:
    - cron: '0 7 1 * *' # 1st of the month, 07:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  # Shared with the refresh workflows (docs/operations.md §Concurrency); also stops two drift
  # runs racing to file duplicate issues.
  group: scrape
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: live
        run: npm -w scraper run check:live
        continue-on-error: true
      - if: steps.live.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'RunRepeat contract drift';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && i.title === title);
            const body = `check:live failed on ${new Date().toISOString()}. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
      - if: steps.live.outcome == 'failure'
        run: exit 1
