name: Refresh metrics
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to dispatch ci.yml (docs/operations.md §The refresh chain)
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm -w scraper run scrape:metrics
      - name: Scrape details for newly listed shoes
        # Non-fatal on purpose (docs/operations.md §Where failures are contained).
        continue-on-error: true
        run: npm -w scraper run scrape:details
      - name: Release supplement (only if new shoes appeared)
        # Deliberately not a weekly cost (docs/operations.md §The weekly release supplement).
        run: |
          if ! git diff --quiet -- data/details.json; then
            npm -w scraper run scrape:releases
          else
            echo 'details.json unchanged — skipping release supplement'
          fi
      - run: npm -w scraper run build:dataset
      - name: Commit if changed
        id: commit
        run: |
          git add -A data
          if ! git diff --cached --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "data: metrics refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger CI
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
