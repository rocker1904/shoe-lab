name: Refresh metrics
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to dispatch deploy — GITHUB_TOKEN pushes do NOT trigger push-event workflows
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm -w scraper run scrape:metrics
      - name: Scrape details for newly listed shoes
        # Non-fatal on purpose: metrics are the primary product of this job, and scrape:details
        # exits 1 if any single slug fails. One permanently-broken page must not discard a
        # completed metrics scrape every Monday. Failed slugs stay absent from details.json and
        # are retried next week; the step still shows as failed in the run.
        continue-on-error: true
        run: npm -w scraper run scrape:details
      - name: Release supplement (only if new shoes appeared)
        # The supplement is deliberately not a weekly cost: in the common case details.json is
        # unchanged and we skip it, keeping the weekly footprint at ~65 requests. When
        # scrape:details did fetch newly listed shoes, run it so they are never left dateless.
        run: |
          if ! git diff --quiet -- data/details.json; then
            npm -w scraper run scrape:releases
          else
            echo 'details.json unchanged — skipping release supplement'
          fi
      - run: npm -w scraper run build:dataset
      - name: Commit if changed
        id: commit
        run: |
          git add -A data
          if ! git diff --cached --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "data: metrics refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
