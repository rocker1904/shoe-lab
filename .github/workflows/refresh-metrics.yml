name: Refresh metrics
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to dispatch deploy — GITHUB_TOKEN pushes do NOT trigger push-event workflows
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm -w scraper run scrape:metrics
      - run: npm -w scraper run scrape:details # picks up newly listed shoes
      - run: npm -w scraper run build:dataset
      - name: Commit if changed
        id: commit
        run: |
          git add -A data
          if ! git diff --cached --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "data: metrics refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
