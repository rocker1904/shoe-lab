name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Token-authored refresh commits do not emit a push event, so the refresh workflow dispatches
  # this same gate explicitly rather than bypassing it on the way to deploy.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The whole gate — everything that can run on Linux: the verify sequence and all three
  # engines' e2e (overlay scrollbars, the regime Linux draws). `classic-scrollbars` below is
  # the one regime this job cannot reach.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One step on purpose: the verify sequence has a single owner in package.json,
      # so a local run mirrors CI exactly.
      - run: npm run verify
      # One step: the split that let the timings price the two extra engines served its decision,
      # and cross-browser is settled (app/e2e/cross-browser.spec.ts says why they are here).
      - run: npx playwright install chromium firefox webkit --with-deps
      - run: npm -w app run e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one scrollbar regime Linux cannot draw here. Playwright gives OVERLAY scrollbars headless in
  # every engine, and inside the Playwright image a headed WebKit under xvfb hangs — so every guard
  # this repo owns about a bar taking 12-15px out of the layout viewport is measured in Chromium and
  # Firefox and nowhere else. macOS draws WebKit's own bars, and `AppleShowScrollBars` is what makes
  # them classic rather than the overlay a trackpad gets.
  #
  # Whether Playwright's WebKit honours that default is a question this job answers in its own log
  # rather than one anybody takes on trust: `fit-boundary` MEASURES the bar and names the width it
  # found for each regime on its closing line. `0px bar` there means macOS served an overlay after
  # all and this job covers WebKit's layout rather than the classic regime — which is worth knowing,
  # and worth keeping either way.
  #
  # It gates the deploy, like every job here: the dispatch job needs this one to succeed
  # (docs/operations.md §Deploy).
  classic-scrollbars:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: defaults write -g AppleShowScrollBars -string Always
      # macOS ships Tab-skips-buttons (keyboard navigation off), so every keyboard-walk test lands
      # on different stops than the app's real tab order — the job's first run failed exactly the
      # three walk tests. 2 is "all controls", the setting a macOS keyboard user who tabs an app has.
      - run: defaults write -g AppleKeyboardUIMode -int 2
      # WebKit alone. It is the engine macOS draws natively, and the other two already run both
      # regimes on a developer's machine through `hunt/fit-boundary.mjs`.
      - run: npx playwright install webkit
      # The real fleet, and before `e2e` swaps the five-shoe fixture into `dist/`: the fit
      # boundary is a claim only the fleet can make, and its classic half has never run anywhere
      # (`.hunt/fixlog-f14.md`).
      - run: node hunt/fit-boundary.mjs webkit
      # Headed, which is the whole point: the suite's own scrollbar-implicated geometry — the
      # one-row toolbar's fit at 801px, the sidebar's tab stops, the panels' ways out, the fit
      # ladder — asked in the regime where a bar takes layout.
      #
      # One expected exception to read carefully: a 360px window with a classic bar is a 345px
      # LAYOUT, which is inside the narrowest phone this table is designed for, and `fit-boundary`
      # asserts from 360px of LAYOUT for exactly that reason. If `fits six columns and keeps the
      # rest reachable at 360px` is what goes red here, it is the design's own floor being asked in
      # window widths rather than a regression.
      # docs/app.md §Two renderings, and only one of them mounted
      - run: npm -w app run e2e -- --project=webkit --headed
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-macos
          path: app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  dispatch-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [full-suite, classic-scrollbars]
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the proved CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$SOURCE_RUN_ID"
