name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One step on purpose: the verify sequence has a single owner in package.json,
      # so a local run mirrors CI exactly.
      - run: npm run verify
      - run: npx playwright install chromium --with-deps
      # Separate step, not folded into the line above, so the workflow's own timings report what
      # the two extra engines cost (app/e2e/cross-browser.spec.ts says why they are here).
      - run: npx playwright install firefox webkit --with-deps
      - run: npm -w app run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
