name: Refresh details
on:
  workflow_dispatch:
    inputs:
      force_all:
        description: Re-crawl every shoe page (slow — one request per catalogued shoe)
        type: boolean
        default: false
      slug:
        description: Re-crawl a single shoe slug
        type: string
        required: false
permissions:
  contents: write
  actions: write # to dispatch ci.yml (docs/operations.md §The refresh chain)
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scrape details
        # Inputs go through env, never string-interpolated into the shell.
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          SLUG: ${{ inputs.slug }}
        run: |
          args=()
          if [ "$FORCE_ALL" = 'true' ]; then args+=(--force-all); fi
          if [ -n "$SLUG" ]; then args+=(--slug "$SLUG"); fi
          npm -w scraper run scrape:details -- "${args[@]}"
      # Non-fatal: a drifted supplement must not discard a completed details crawl
      # (docs/operations.md §Where failures are contained).
      - run: npm -w scraper run scrape:releases
        continue-on-error: true
      - run: npm -w scraper run build:dataset
      - name: Commit if changed
        id: commit
        run: |
          git add -A data
          if ! git diff --cached --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "data: details refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger CI
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
