name: Deploy
on:
  # Gated on CI rather than firing on push: two red-CI commits deployed during the
  # 2026-08 fix campaign before anyone read the CI result. The dispatch path stays
  # ungated — the refresh chain validates its own data and its GITHUB_TOKEN pushes
  # never ran CI anyway (docs/operations.md §The refresh chain).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # A deployment is never killed mid-flight (docs/operations.md §Concurrency).
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy exactly the commit CI proved, not whatever main means by checkout time.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm -w app run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v5
